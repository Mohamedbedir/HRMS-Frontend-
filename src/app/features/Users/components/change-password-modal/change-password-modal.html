<div class="user-modal-backdrop" role="presentation" (click)="close()">
  <section class="user-modal password-modal" role="dialog" aria-modal="true" aria-labelledby="change-password-title"
    (click)="$event.stopPropagation()">
    <header class="d-flex align-items-start justify-content-between gap-3 text-start mb-4">
      <div>
        <h2 id="change-password-title" class="h5 fw-bold mb-1">Change password</h2>
        <p class="text-body-secondary mb-0">{{ user.fullName || user.userName }}</p>
      </div>
      <button type="button" class="btn-close" aria-label="Close" [disabled]="isLoading" (click)="close()"></button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3 text-start">
        <label for="new-user-password" class="form-label">New password</label>
        <input
          id="new-user-password"
          type="password"
          class="form-control"
          autocomplete="new-password"
          formControlName="newPassword"
          [class.is-invalid]="isInvalid('newPassword')"
        />
        @if (isInvalid('newPassword')) {
          <div class="invalid-feedback">Enter a new password.</div>
        }
      </div>
      <div class="mb-3 text-start">
        <label for="confirm-user-password" class="form-label">Confirm password</label>
        <input
          id="confirm-user-password"
          type="password"
          class="form-control"
          autocomplete="new-password"
          formControlName="confirmPassword"
          [class.is-invalid]="isInvalid('confirmPassword') || (submittedAttempt && form.hasError('passwordMismatch'))"
        />
        @if (isInvalid('confirmPassword')) {
          <div class="invalid-feedback">Confirm the new password.</div>
        } @else if (submittedAttempt && form.hasError('passwordMismatch')) {
          <div class="invalid-feedback d-block">The passwords do not match.</div>
        }
      </div>

      <footer class="user-modal-actions">
        <button type="button" class="btn btn-outline-secondary" [disabled]="isLoading" (click)="close()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          @if (isLoading) { <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Saving... }
          @else { <i class="bi bi-key me-2" aria-hidden="true"></i>Change password }
        </button>
      </footer>
    </form>
  </section>
</div>
