<div class="modal-backdrop" (click)="closed.emit()">
  <section class="document-modal" role="dialog" aria-modal="true" aria-labelledby="edit-title"
    (click)="$event.stopPropagation()">
    <header class="modal-header">
      <div>
        <span class="modal-eyebrow">MY DOCUMENTS</span>
        <h2 id="edit-title">Edit document</h2>
        <p>Update its details or replace the uploaded file.</p>
      </div>
      <button type="button" class="modal-close" aria-label="Close" (click)="closed.emit()">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </header>

    <form (ngSubmit)="submit()">
      @if (errorMessage) {
        <div class="alert alert-danger py-2" role="alert">{{ errorMessage }}</div>
      }
      <label class="form-label" for="edit-document-type">Document type <span class="text-danger">*</span></label>
      <input id="edit-document-type" class="form-control mb-3" name="documentType"
        [(ngModel)]="documentType" required maxlength="100" />

      <label class="form-label" for="edit-document-file">Replace file <span class="text-secondary">(optional)</span></label>
      <input id="edit-document-file" class="form-control" type="file" name="file"
        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" (change)="onFileSelected($event)" />
      <span class="selected-file">
        @if (selectedFile) {
          <i class="bi bi-paperclip me-1" aria-hidden="true"></i>{{ selectedFile.name }}
        } @else {
          Current file: {{ document.fileName || 'not available' }}
        }
      </span>

      <label class="form-label mt-3" for="edit-expiry-date">Expiry date <span class="text-secondary">(optional)</span></label>
      <input id="edit-expiry-date" class="form-control" type="date" name="expiryDate"
        [(ngModel)]="expiryDate" />

      <footer class="modal-actions">
        <button type="button" class="btn btn-outline-secondary" [disabled]="isSaving" (click)="closed.emit()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving || !documentType.trim()">
          @if (isSaving) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Saving…
          } @else {
            <i class="bi bi-check-lg me-2" aria-hidden="true"></i>Save changes
          }
        </button>
      </footer>
    </form>
  </section>
</div>
