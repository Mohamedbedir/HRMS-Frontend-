<div
    class="card employee-card h-100 border-0 shadow-sm"
    role="link"
    tabindex="0"
    (click)="viewEmployee.emit(employee.id)"
    (keydown.enter)="viewEmployee.emit(employee.id)">

    <div class="card-body">

        <div class="d-flex justify-content-between align-items-start">

            <!-- Avatar -->

            <div class="employee-avatar">

                {{ initials }}

            </div>


            <!-- Actions -->

            <div class="dropdown">

                <button class="btn btn-sm btn-light" type="button" data-bs-toggle="dropdown"
                    aria-label="Employee actions" (click)="$event.stopPropagation()"
                    (keydown.enter)="$event.stopPropagation()">

                    <i class="bi bi-three-dots-vertical"></i>

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <button class="dropdown-item"
                            (click)="$event.stopPropagation(); viewEmployee.emit(employee.id)"
                            (keydown.enter)="$event.stopPropagation()">

                            <i class="bi bi-eye me-2"></i>
                            View

                        </button>
                    </li>

                    <li>
                        <button class="dropdown-item"
                            (click)="$event.stopPropagation(); editEmployee.emit(employee.id)"
                            (keydown.enter)="$event.stopPropagation()">

                            <i class="bi bi-pencil me-2"></i>
                            Edit

                        </button>
                    </li>

                </ul>

            </div>

        </div>


        <!-- Employee -->

        <div class="mt-3">

            <h5 class="mb-1">
                {{ fullName }}
            </h5>

            <p class="text-muted small mb-0">
                #EMP-{{ employee.id.toString().padStart(6, '0') }}
            </p>

        </div>


        <!-- Position -->

        <div class="mt-3">

            <div class="text-muted small">
                Position
            </div>

            <div class="fw-medium">
                {{ employee.positionTitle }}
            </div>

        </div>


        <!-- Department -->

        <div class="mt-2">

            <div class="text-muted small">
                Department
            </div>

            <div class="fw-medium">
                {{ employee.departmentName }}
            </div>

        </div>


        <!-- Contact -->

        <div class="mt-3">

            <div class="small text-muted">
                <i class="bi bi-envelope me-2"></i>
                {{ employee.email }}
            </div>

            <div class="small text-muted mt-1">
                <i class="bi bi-telephone me-2"></i>
                {{ employee.phone }}
            </div>

        </div>


        <!-- Footer -->

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">

            <span class="badge rounded-pill px-3 py-2" [class]="statusClass">

                {{ employee.status }}

            </span>

            <small class="text-muted">

                Joined
                {{ employee.hireDate | date:'dd MMM yyyy' }}

            </small>

        </div>

    </div>

</div>
