<article class="card position-card h-100 border-0 shadow-sm">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-3">
      <a
        class="position-card-link stretched-link text-decoration-none text-body flex-grow-1"
        [routerLink]="['/admin/positions', position.id]"
        [attr.aria-label]="'View details for ' + position.title">
        <h5 class="card-title fw-semibold mb-2">{{ position.title }}</h5>
        <span
          class="badge rounded-pill"
          [class.text-bg-success]="position.isActive"
          [class.text-bg-secondary]="!position.isActive">
          {{ position.isActive ? 'Active' : 'Inactive' }}
        </span>
        <p class="card-text text-muted mt-3 mb-0">{{ position.description || 'No description available.' }}</p>
        <div class="pt-3">
          <small class="text-muted">Created {{ position.createdAt.slice(0, 10) }}</small>
        </div>
      </a>

      <div class="position-card-actions dropdown">
        <button
          type="button"
          class="btn btn-sm btn-light"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          [attr.aria-label]="'Actions for ' + position.title"
          (click)="$event.stopPropagation()">
          <i class="bi bi-three-dots-vertical" aria-hidden="true"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <button type="button" class="dropdown-item" (click)="$event.stopPropagation(); edit.emit(position)">
              <i class="bi bi-pencil me-2" aria-hidden="true"></i>
              Edit
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item text-danger" (click)="$event.stopPropagation(); delete.emit(position)">
              <i class="bi bi-trash me-2" aria-hidden="true"></i>
              Delete
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</article>
