@if (position; as item) {
  <div
    class="modal fade show d-block bg-dark bg-opacity-50"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="position-delete-title"
    (click)="close()">
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h2 id="position-delete-title" class="modal-title h5 fw-bold mb-0">Delete Position</h2>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            [disabled]="isDeleting"
            (click)="close()">
          </button>
        </div>

        <div class="modal-body">
          <div class="d-flex align-items-start gap-3">
            <span class="text-danger fs-3" aria-hidden="true">
              <i class="bi bi-exclamation-triangle"></i>
            </span>
            <p class="mb-0">
              Are you sure you want to delete <strong>{{ item.title }}</strong>?
              This action cannot be undone.
            </p>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" [disabled]="isDeleting" (click)="close()">
            Cancel
          </button>
          <button type="button" class="btn btn-danger" [disabled]="isDeleting" (click)="confirmDelete()">
            @if (isDeleting) {
              <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              Deleting...
            } @else {
              <i class="bi bi-trash me-2" aria-hidden="true"></i>
              Delete Position
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
