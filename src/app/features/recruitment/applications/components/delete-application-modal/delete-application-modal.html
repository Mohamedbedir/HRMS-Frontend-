<div class="modal-backdrop" (click)="closed.emit()">
  <section class="application-modal delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-application-title"
    (click)="$event.stopPropagation()">
    <div class="delete-icon" aria-hidden="true"><i class="bi bi-person-x"></i></div>
    <h2 id="delete-application-title">Delete this application?</h2>
    <p>
      The application for <strong>{{ application.candidateName }}</strong>
      to <strong>{{ application.jobPostTitle }}</strong> will be permanently removed.
    </p>

    <footer class="modal-actions">
      <button type="button" class="btn btn-outline-secondary" [disabled]="isDeleting" (click)="closed.emit()">Cancel</button>
      <button type="button" class="btn btn-danger" [disabled]="isDeleting" (click)="confirmDelete()">
        @if (isDeleting) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Deleting…
        } @else {
          <i class="bi bi-trash me-2" aria-hidden="true"></i>Delete application
        }
      </button>
    </footer>
  </section>
</div>
