<div class="modal-backdrop" (click)="closed.emit()">
  <section class="job-modal" role="dialog" aria-modal="true" aria-labelledby="edit-job-title"
    (click)="$event.stopPropagation()">
    <header class="modal-heading">
      <div>
        <span class="eyebrow">TALENT ACQUISITION</span>
        <h2 id="edit-job-title">Edit job posting</h2>
        <p>Update the role, its department or position, and salary range.</p>
      </div>
      <button type="button" class="close-button" aria-label="Close" [disabled]="isSubmitting" (click)="closed.emit()">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </header>

    @if (isLoadingOptions) {
      <div class="options-loading" role="status">
        <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>Loading departments and positions…
      </div>
    } @else if (optionsError) {
      <div class="alert alert-warning" role="alert">
        Departments and positions could not be loaded. Close this window and try again.
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="edit-job-title-input">Job title <span class="text-danger">*</span></label>
          <input id="edit-job-title-input" class="form-control" formControlName="title" maxlength="150" />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="edit-job-department-search">Department <span class="text-danger">*</span></label>
          <div class="select-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input id="edit-job-department-search" class="form-control" type="search" [value]="departmentSearch"
              (input)="onDepartmentSearch($event)" placeholder="Search departments" />
          </div>
          <select class="form-select mt-2" formControlName="departmentId" aria-label="Select department">
            <option [ngValue]="0" disabled>Select department</option>
            @for (department of filteredDepartments; track department.id) {
              <option [ngValue]="department.id">{{ department.name }}</option>
            }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="edit-job-position-search">Position <span class="text-danger">*</span></label>
          <div class="select-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input id="edit-job-position-search" class="form-control" type="search" [value]="positionSearch"
              (input)="onPositionSearch($event)" placeholder="Search positions" />
          </div>
          <select class="form-select mt-2" formControlName="positionId" aria-label="Select position">
            <option [ngValue]="0" disabled>Select position</option>
            @for (position of filteredPositions; track position.id) {
              <option [ngValue]="position.id">{{ position.title }}</option>
            }
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="edit-job-description">Description <span class="text-danger">*</span></label>
          <textarea id="edit-job-description" class="form-control" rows="5" formControlName="description" maxlength="5000"></textarea>
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="edit-job-min-salary">Minimum salary</label>
          <input id="edit-job-min-salary" class="form-control" type="number" min="0" step="0.01" formControlName="minSalary" />
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="edit-job-max-salary">Maximum salary</label>
          <input id="edit-job-max-salary" class="form-control" type="number" min="0" step="0.01" formControlName="maxSalary" />
        </div>
        <div class="col-12">
          <label class="form-label" for="edit-job-closing-date">Closing date <span class="text-danger">*</span></label>
          <input id="edit-job-closing-date" class="form-control" type="date" formControlName="closingDate" />
        </div>
      </div>

      <footer class="modal-actions">
        <button type="button" class="btn btn-outline-secondary" [disabled]="isSubmitting" (click)="closed.emit()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting || isLoadingOptions || optionsError">
          @if (isSubmitting) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Saving…
          } @else {
            <i class="bi bi-check-lg me-2" aria-hidden="true"></i>Save changes
          }
        </button>
      </footer>
    </form>
  </section>
</div>
