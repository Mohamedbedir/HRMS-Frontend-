<div class="leave-action-backdrop" role="presentation" (click)="close()">
  <section class="modal fade show d-block leave-action-modal" role="alertdialog" aria-modal="true"
    aria-labelledby="cancel-leave-title" aria-describedby="cancel-leave-description" tabindex="-1"
    (click)="$event.stopPropagation()">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-body text-center">
          <span class="action-icon action-icon-warning" aria-hidden="true"><i class="bi bi-slash-circle"></i></span>
          <h2 id="cancel-leave-title" class="h5 fw-bold mt-3 mb-2">Cancel leave request?</h2>
          <p id="cancel-leave-description" class="text-body-secondary mb-0">
            Are you sure you want to cancel the leave request from <strong class="text-body">{{ employeeName
              }}</strong>?
          </p>
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-outline-secondary" [disabled]="isLoading" (click)="close()">Keep
            request</button>
          <button type="button" class="btn btn-danger" [disabled]="isLoading" (click)="confirmed.emit()">
            @if (isLoading) { <span class="spinner-border spinner-border-sm me-2"
              aria-hidden="true"></span>Cancelling... }
            @else { <i class="bi bi-slash-circle me-1" aria-hidden="true"></i>Cancel request }
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
