<div class="modal fade show d-block bg-dark bg-opacity-50" tabindex="-1" role="dialog" aria-modal="true"
  aria-labelledby="department-edit-title" (click)="!isSubmitting && closed.emit()">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <div>
          <h2 id="department-edit-title" class="modal-title h5 fw-bold mb-1">Edit Department</h2>
          <p class="text-body-secondary mb-0">Update department details and status.</p>
        </div>
        <button type="button" class="btn-close" aria-label="Close" [disabled]="isSubmitting"
          (click)="closed.emit()"></button>
      </div>

      <form [formGroup]="editDepartmentForm" (ngSubmit)="submit()">
        <div class="modal-body">
          <input type="hidden" formControlName="id" />

          <div class="mb-3">
            <label for="edit-department-name" class="form-label">Department name</label>
            <input id="edit-department-name" type="text" class="form-control" formControlName="name" maxlength="50"
              autocomplete="organization" [class.is-invalid]="getControlError('name')"
              [class.is-valid]="isControlValid('name')" />
            @if (getControlError('name'); as error) {
            <div class="invalid-feedback d-block">{{ error }}</div>
            }
          </div>

          <div class="mb-3">
            <label for="edit-department-description" class="form-label">Description</label>
            <textarea id="edit-department-description" class="form-control" formControlName="description" rows="4"
              maxlength="500" [class.is-invalid]="getControlError('description')"
              [class.is-valid]="isControlValid('description')"></textarea>
            @if (getControlError('description'); as error) {
            <div class="invalid-feedback d-block">{{ error }}</div>
            }
          </div>

          <div>
            <label for="edit-department-status" class="form-label">Status</label>
            <select id="edit-department-status" class="form-select" formControlName="isActive"
              [class.is-invalid]="getControlError('isActive')" [class.is-valid]="isControlValid('isActive')">
              <option [ngValue]="true">Active</option>
              <option [ngValue]="false">Inactive</option>
            </select>
            @if (getControlError('isActive'); as error) {
            <div class="invalid-feedback d-block">{{ error }}</div>
            }
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" [disabled]="isSubmitting" (click)="closed.emit()">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
            @if (isSubmitting) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Saving...
            } @else {
            <i class="bi bi-check-lg me-2" aria-hidden="true"></i>
            Save Changes
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
