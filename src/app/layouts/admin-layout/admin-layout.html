<div class="admin-wrapper" [class.sidebar-collapsed]="sidebarCollapsed" [class.dark-mode]="isDarkMode">

    <!-- Sidebar -->
    <aside class="admin-sidebar">

        <!-- Logo -->
        <div class="sidebar-header">

            <a routerLink="/admin/dashboard" class="brand text-decoration-none">

                <img src="HR-Icon.ico" alt="HRMS Logo" class="brand-logo">

                <span class="brand-text">
                    HRMS
                </span>

            </a>

            <button type="button" class="btn sidebar-close d-lg-none" (click)="toggleSidebar()">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>


        <!-- Navigation -->
        <div class="sidebar-body">

            <small class="nav-title">
                MAIN MENU
            </small>

            <nav class="nav flex-column">

                <!-- Dashboard -->
                <a routerLink="dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                    class="nav-link">
                    <i class="bi bi-grid-1x2-fill"></i>

                    <span class="nav-text">
                        Dashboard
                    </span>
                </a>


                <!-- Employees -->
                <a routerLink="employees" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-people-fill"></i>

                    <span class="nav-text">
                        Employees
                    </span>
                </a>


                <!-- Departments -->
                <a routerLink="departments" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-diagram-3-fill"></i>

                    <span class="nav-text">
                        Departments
                    </span>
                </a>


                <!-- Positions -->
                <a routerLink="positions" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-briefcase-fill"></i>

                    <span class="nav-text">
                        Positions
                    </span>
                </a>

            </nav>

        </div>


        <!-- Sidebar Footer -->
        <div class="sidebar-footer">

            <button type="button" class="logout-button" (click)="logout()">

                <i class="bi bi-box-arrow-right"></i>

                <span class="nav-text">
                    Logout
                </span>

            </button>

        </div>

    </aside>


    <!-- Main -->
    <div class="admin-main">


        <!-- Topbar -->
        <header class="admin-navbar">

            <div class="d-flex align-items-center gap-3">

                <!-- Sidebar Toggle -->
                <button type="button" class="menu-button" (click)="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>


                <div>

                    <small class="text-muted">
                        Welcome back
                    </small>
                </div>

            </div>


            <!-- Right -->
            <div class="d-flex align-items-center gap-3">

                <!-- Theme Toggle -->
                <button type="button" class="icon-button theme-button" (click)="toggleTheme()"
                    [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">

                    <i class="bi" [class.bi-sun-fill]="isDarkMode" [class.bi-moon-stars-fill]="!isDarkMode"></i>

                </button>

                <!-- Notification -->
                <button type="button" class="icon-button position-relative">

                    <i class="bi bi-bell"></i>

                    <span class="notification-dot"></span>

                </button>


                <!-- User -->
                <div class="dropdown">

                    <button type="button" class="user-button dropdown-toggle" data-bs-toggle="dropdown"
                        aria-expanded="false">

                        <div class="avatar">
                            {{ userEmail.charAt(0).toUpperCase() }}
                        </div>

                        <div class="user-info d-none d-md-block text-start">

                            <span class="user-name">
                                {{ userName }}
                            </span>


                        </div>

                    </button>


                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">

                        <li>
                            <h6 class="dropdown-header">
                                {{ userEmail }}
                            </h6>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <button class="dropdown-item text-danger" type="button" (click)="logout()">

                                <i class="bi bi-box-arrow-right me-2"></i>

                                Logout

                            </button>
                        </li>

                    </ul>

                </div>

            </div>

        </header>


        <!-- Page -->
        <main class="admin-content">

            <div class="container-fluid">

                <router-outlet></router-outlet>

            </div>

        </main>


        <!-- Footer -->
        <footer class="admin-footer">

            <span>
                © {{ currentYear }} HRMS
            </span>

            <span>
                Human Resources Management System
            </span>

        </footer>

    </div>

</div>
